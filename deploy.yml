name: Deploy portfolio to GitHub Pages

# Publishes the site automatically whenever changes are pushed to the main branch.
on:
  push:
    branches: ["main"]
  workflow_dispatch:        # also lets you trigger a deploy manually from the Actions tab

# Permissions required for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one deploy at a time; don't cancel an in-progress run
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site files
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'            # uploads the whole repo (index.html, styles.css)

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
